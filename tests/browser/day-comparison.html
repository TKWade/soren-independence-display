<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><title>Day comparison viewport</title><style>html,body{margin:0;padding:0}iframe{display:block;border:0}</style></head><body>
<script type="module">
 if(!import.meta.env.DEV) throw new Error('Development fixture only')
 const params=new URLSearchParams(location.search)
 const sizes={large:[1280,800],medium:[1024,640],small:[960,600]}
 const [width,height]=sizes[params.get('size')]??sizes.large
 const frame=document.createElement('iframe')
 frame.title='Day comparison'
 frame.width=String(width);frame.height=String(height)
 frame.src='./index.html?comparison&day=2026-09-23&dayVariant='+(params.get('dayVariant')==='a'?'a':'b')
 document.body.append(frame)
</script></body></html>
